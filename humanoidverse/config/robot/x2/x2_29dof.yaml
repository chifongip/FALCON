# @package _global_

defaults:
  - robot_base

robot:
  # Observation parameters
  num_bodies: 30
  dof_obs_size: 29
  actions_dim: 29
  lower_body_actions_dim: 15
  upper_body_actions_dim: 14
  body_keys: ["lower_body", "upper_body"]
  policy_obs_dim: -1
  critic_obs_dim: -1

  force_control:
    apply_force_link: ["left_wrist_roll_link", "right_wrist_roll_link"]
    left_hand_link: "left_wrist_roll_link"
    right_hand_link: "right_wrist_roll_link"

  key_bodies: ["left_ankle_roll_link", "right_ankle_roll_link"]
  contact_bodies: [ "left_ankle_roll_link", "right_ankle_roll_link" ]
  num_feet: 2
  right_foot_name: "right_ankle_roll_link"
  left_foot_name: "left_ankle_roll_link"
  foot_name: "ankle_roll_link"
  knee_name: "knee_link"
  has_torso: True
  torso_name: "torso_link"
  base_name: "pelvis"
  has_upper_body_dof: True
  dof_names: ['left_hip_pitch_joint', 'left_hip_roll_joint', 'left_hip_yaw_joint', 'left_knee_joint', 'left_ankle_pitch_joint', 'left_ankle_roll_joint',
              'right_hip_pitch_joint', 'right_hip_roll_joint', 'right_hip_yaw_joint', 'right_knee_joint', 'right_ankle_pitch_joint', 'right_ankle_roll_joint',
              'waist_yaw_joint', 'waist_pitch_joint', 'waist_roll_joint',
              'left_shoulder_pitch_joint', 'left_shoulder_roll_joint', 'left_shoulder_yaw_joint', 'left_elbow_joint', 
              'left_wrist_yaw_joint', 'left_wrist_pitch_joint', 'left_wrist_roll_joint',
              'right_shoulder_pitch_joint', 'right_shoulder_roll_joint', 'right_shoulder_yaw_joint', 'right_elbow_joint', 
              'right_wrist_yaw_joint', 'right_wrist_pitch_joint', 'right_wrist_roll_joint']
  upper_dof_names: ['left_shoulder_pitch_joint', 'left_shoulder_roll_joint', 'left_shoulder_yaw_joint', 'left_elbow_joint', 
                    'left_wrist_yaw_joint', 'left_wrist_pitch_joint', 'left_wrist_roll_joint',
                    'right_shoulder_pitch_joint', 'right_shoulder_roll_joint', 'right_shoulder_yaw_joint', 'right_elbow_joint', 
                    'right_wrist_yaw_joint', 'right_wrist_pitch_joint', 'right_wrist_roll_joint']
  upper_left_arm_dof_names: ['left_shoulder_pitch_joint', 'left_shoulder_roll_joint', 'left_shoulder_yaw_joint', 'left_elbow_joint', 
                             'left_wrist_yaw_joint', 'left_wrist_pitch_joint', 'left_wrist_roll_joint']
  upper_right_arm_dof_names: ['right_shoulder_pitch_joint', 'right_shoulder_roll_joint', 'right_shoulder_yaw_joint', 'right_elbow_joint',
                              'right_wrist_yaw_joint', 'right_wrist_pitch_joint', 'right_wrist_roll_joint']
  lower_dof_names: ['left_hip_pitch_joint', 'left_hip_roll_joint', 'left_hip_yaw_joint', 'left_knee_joint', 'left_ankle_pitch_joint', 'left_ankle_roll_joint',
                    'right_hip_pitch_joint', 'right_hip_roll_joint', 'right_hip_yaw_joint', 'right_knee_joint', 'right_ankle_pitch_joint', 'right_ankle_roll_joint',
                    'waist_yaw_joint', 'waist_pitch_joint', 'waist_roll_joint']
  waist_dof_names: ['waist_yaw_joint', 'waist_pitch_joint', 'waist_roll_joint']
  waist_yaw_dof_name: 'waist_yaw_joint'
  waist_roll_dof_name: 'waist_roll_joint'
  waist_pitch_dof_name: 'waist_pitch_joint'
  arm_dof_names: ['left_shoulder_pitch_joint', 'left_shoulder_roll_joint', 'left_shoulder_yaw_joint', 'left_elbow_joint', 
                  'left_wrist_yaw_joint', 'left_wrist_pitch_joint', 'left_wrist_roll_joint',
                  'right_shoulder_pitch_joint', 'right_shoulder_roll_joint', 'right_shoulder_yaw_joint', 'right_elbow_joint', 
                  'right_wrist_yaw_joint', 'right_wrist_pitch_joint', 'right_wrist_roll_joint']
  left_arm_dof_names: ['left_shoulder_pitch_joint', 'left_shoulder_roll_joint', 'left_shoulder_yaw_joint', 'left_elbow_joint', 
                      'left_wrist_yaw_joint', 'left_wrist_pitch_joint', 'left_wrist_roll_joint']
  right_arm_dof_names: ['right_shoulder_pitch_joint', 'right_shoulder_roll_joint', 'right_shoulder_yaw_joint', 'right_elbow_joint', 
                       'right_wrist_yaw_joint', 'right_wrist_pitch_joint', 'right_wrist_roll_joint']
  left_ankle_dof_names: ['left_ankle_pitch_joint', 'left_ankle_roll_joint']
  right_ankle_dof_names: ['right_ankle_pitch_joint', 'right_ankle_roll_joint']
  knee_dof_names: ['left_knee_joint', 'right_knee_joint']
  symmetric_dofs_idx:
    lower_left_dofs_idx_no: [0, 3, 4]
    lower_left_dofs_idx_op: [1, 2, 5]
    lower_right_dofs_idx_no: [6, 9, 10]
    lower_right_dofs_idx_op: [7, 8, 11]
  dof_pos_lower_limit_list: [-2.704, -0.235, -1.684, 0.0, -0.803, -0.262,
                             -2.704, -2.906, -3.43, 0.0, -0.803, -0.2625,
                             -3.43, -0.314, -0.488,
                             -3.08, -0.061, -2.556, -2.3556,
                             -2.556, -0.558, -1.571,
                             -3.08, -2.993, -2.556, -2.3556,
                             -2.556, -0.558, -0.724]
  dof_pos_upper_limit_list: [2.556, 2.906, 3.43, 2.4073, 0.453, 0.262,
                             2.556, 0.235, 1.684, 2.4073, 0.453, 0.2625,
                             2.382, 0.314, 0.488,
                             2.04, 2.993, 2.556, 0.0,
                             2.556, 0.558, 0.724,
                             2.04, 0.061, 2.556, 0.0,
                             2.556, 0.558, 1.571]
  dof_vel_limit_list: [11.936, 11.936, 11.936, 11.936, 13.087, 15.077,
                       11.936, 11.936, 11.936, 11.936, 13.088, 15.077,
                       11.936, 13.088, 13.088,
                       13.088, 13.088, 15.077, 15.077,
                       15.077, 4.188, 4.188,
                       13.088, 13.088, 15.077, 15.077,
                       15.077, 4.188, 4.188]
  dof_effort_limit_list: [120, 120, 120, 120, 36, 24,
                          120, 120, 120, 120, 36, 24,
                          120, 48, 48,
                          36, 36, 24, 24,
                          24, 4.8, 4.8,
                          36, 36, 24, 24,
                          24, 4.8, 4.8]
  dof_effort_limit_scale: 0.8
  # only apply for isaacsim
  dof_armature_list: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03, 0.03,
                      0.03, 0.03, 0.03]
  # only apply for isaacsim
  dof_joint_friction_list: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03, 0.03,
                            0.03, 0.03, 0.03]

  body_names: ['pelvis', 
                'left_hip_pitch_link', 'left_hip_roll_link', 'left_hip_yaw_link', 'left_knee_link', 'left_ankle_pitch_link', 'left_ankle_roll_link',
                'right_hip_pitch_link', 'right_hip_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_pitch_link', 'right_ankle_roll_link',
                'waist_yaw_link', 'waist_pitch_link', 'torso_link',
                'left_shoulder_pitch_link', 'left_shoulder_roll_link', 'left_shoulder_yaw_link', 'left_elbow_link', 
                'left_wrist_yaw_link', 'left_wrist_pitch_link', 'left_wrist_roll_link', 
                'right_shoulder_pitch_link', 'right_shoulder_roll_link', 'right_shoulder_yaw_link', 'right_elbow_link', 
                'right_wrist_yaw_link', 'right_wrist_pitch_link', 'right_wrist_roll_link']


  terminate_after_contacts_on : ["pelvis", "shoulder", "hip"]
  penalize_contacts_on: ["pelvis", "shoulder", "hip"]
  init_state:
    pos: [0.0, 0.0, 0.7] # x,y,z [m]
    rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
    lin_vel: [0.0, 0.0, 0.0]  # x,y,z [m/s]
    ang_vel: [0.0, 0.0, 0.0]  # x,y,z [rad/s]
    default_joint_angles: # = target angles [rad] when action = 0.0
      left_hip_pitch_joint: 0.
      left_hip_roll_joint: 0.
      left_hip_yaw_joint: 0.
      left_knee_joint: 0.
      left_ankle_pitch_joint: 0.
      left_ankle_roll_joint: 0.
      right_hip_pitch_joint: 0.
      right_hip_roll_joint: 0.
      right_hip_yaw_joint: 0.
      right_knee_joint: 0.
      right_ankle_pitch_joint: 0.
      right_ankle_roll_joint: 0.
      waist_yaw_joint : 0.
      waist_pitch_joint : 0.
      waist_roll_joint : 0.
      left_shoulder_pitch_joint: 0.
      left_shoulder_roll_joint: 0.
      left_shoulder_yaw_joint: 0.
      left_elbow_joint: 0.
      left_wrist_yaw_joint: 0.
      left_wrist_pitch_joint: 0.
      left_wrist_roll_joint: 0.
      right_shoulder_pitch_joint: 0.
      right_shoulder_roll_joint: 0.
      right_shoulder_yaw_joint: 0.
      right_elbow_joint: 0.
      right_wrist_yaw_joint: 0.
      right_wrist_pitch_joint: 0.
      right_wrist_roll_joint: 0.


  randomize_link_body_names: [
    'pelvis', 'left_hip_yaw_link', 'left_hip_roll_link', 'left_hip_pitch_link', 'left_knee_link',
    'right_hip_yaw_link', 'right_hip_roll_link', 'right_hip_pitch_link', 'right_knee_link',
  ]

  control:
    control_type: P # I
    # PD Drive parameters:
    stiffness: # [N*m/rad]
      hip_yaw: 100
      hip_roll: 100
      hip_pitch: 100
      knee: 200
      ankle_pitch: 20
      ankle_roll: 20
      waist_yaw: 300
      waist_roll: 300
      waist_pitch: 300
      shoulder_pitch: 90
      shoulder_roll: 60
      shoulder_yaw: 20
      elbow: 60
      wrist_roll: 4.0
      wrist_pitch: 4.0
      wrist_yaw: 4.0

    damping: # [N*m/rad]  # [N*m*s/rad]
      hip_yaw: 2.5
      hip_roll: 2.5
      hip_pitch: 2.5
      knee: 5.0
      ankle_pitch: 0.2
      ankle_roll: 0.1
      waist_yaw: 5.0
      waist_roll: 5.0
      waist_pitch: 5.0
      shoulder_pitch: 2.0
      shoulder_roll: 1.0
      shoulder_yaw: 0.4
      elbow: 1.0
      wrist_roll: 0.2
      wrist_pitch: 0.2
      wrist_yaw: 0.2

    integral: 
      hip_yaw: 0.0
      hip_roll: 0.0
      hip_pitch: 0.0
      knee: 0.0
      ankle_pitch: 0.0
      ankle_roll: 0.0
      waist_yaw: 0.0
      waist_roll: 0.0
      waist_pitch: 0.0
      shoulder_pitch: 2.0
      shoulder_roll: 2.0
      shoulder_yaw: 2.0
      elbow: 2.0
      wrist_roll: 1.5
      wrist_pitch: 1.5
      wrist_yaw: 1.5
    # action scale: target angle = actionScale * action + defaultAngle
    action_scale: 0.25
    action_clip_value: 100.0
    clip_torques: True

  asset:
    collapse_fixed_joints: True # merge bodies connected by fixed joints. Specific fixed joints can be kept by adding " <... dont_collapse="true">
    replace_cylinder_with_capsule: True
    flip_visual_attachments: False
    armature: 0.001 # isaacgym armature is set by this
    thickness: 0.01
    max_angular_velocity: 1000.
    max_linear_velocity: 1000.
    density: 0.001
    angular_damping: 0.
    linear_damping: 0.

    urdf_file: "x2/${robot.asset.robot_type}.urdf"
    usd_file: "x2/${robot.asset.robot_type}.usd"
    xml_file: "x2/${robot.asset.robot_type}.xml"
    robot_type: x2_ultra
    self_collisions: 1 # 1 to disable, 0 to enable self collisions
    default_dof_drive_mode: 3

    fix_base_link: False # TEST: fix base link to world

  motion:
    motion_file : 'humanoidverse/data/motions/x2_29dof/v1/amass_all.pkl'
    asset:
      assetRoot: "humanoidverse/data/robots/x2/"
      assetFileName: "x2_ultra_wo_head.xml"
      urdfFileName: "x2_ultra_wo_head.xml"

    humanoid_type: x2_ultra
    bias_offset: False
    has_self_collision: True
    has_mesh: False
    has_jt_limit: False
    has_dof_subset: True
    has_upright_start: True
    has_smpl_pd_offset: False
    remove_toe: False # For humanoid's geom toe
    motion_sym_loss: False
    sym_loss_coef: 1
    big_ankle: True

    has_shape_obs: false
    has_shape_obs_disc: false
    has_shape_variation: False

    uniform_sample: False
    motion_fps_scale: 1.0

    standardize_motion_length: True
    standardize_motion_length_value: 10 # 10s

    reverse_motion: False

    masterfoot: False
    freeze_toe: false
    freeze_hand: False
    box_body: True
    real_weight: True
    real_weight_porpotion_capsules: True
    real_weight_porpotion_boxes: True

    body_names: ['pelvis', 
                'left_hip_pitch_link', 'left_hip_roll_link', 'left_hip_yaw_link', 'left_knee_link', 'left_ankle_pitch_link', 'left_ankle_roll_link',
                'right_hip_pitch_link', 'right_hip_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_pitch_link', 'right_ankle_roll_link',
                'waist_yaw_link', 'waist_pitch_link', 'torso_link',
                'left_shoulder_pitch_link', 'left_shoulder_roll_link', 'left_shoulder_yaw_link', 'left_elbow_link', 'left_wrist_yaw_link', 'left_wrist_pitch_link', 'left_wrist_roll_link',
                'right_shoulder_pitch_link', 'right_shoulder_roll_link', 'right_shoulder_yaw_link', 'right_elbow_link', 'right_wrist_yaw_link', 'right_wrist_pitch_link', 'right_wrist_roll_link']

    limb_weight_group: 
      - ['left_hip_pitch_link', 'left_hip_roll_link', 'left_hip_yaw_link', 'left_knee_link', 'left_ankle_pitch_link', 'left_ankle_roll_link']
      - ['right_hip_pitch_link', 'right_hip_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_pitch_link', 'right_ankle_roll_link']
      - ['pelvis', 'waist_yaw_link', 'waist_pitch_link', 'torso_link']
      - ['left_shoulder_pitch_link', 'left_shoulder_roll_link', 'left_shoulder_yaw_link', 'left_elbow_link', 'left_wrist_yaw_link', 'left_wrist_pitch_link', 'left_wrist_roll_link']
      - ['right_shoulder_pitch_link', 'right_shoulder_roll_link', 'right_shoulder_yaw_link', 'right_elbow_link', 'right_wrist_yaw_link', 'right_wrist_pitch_link', 'right_wrist_roll_link']

    dof_names: ['left_hip_pitch_link', 'left_hip_roll_link', 'left_hip_yaw_link', 'left_knee_link', 'left_ankle_pitch_link', 'left_ankle_roll_link',
                'right_hip_pitch_link', 'right_hip_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_pitch_link', 'right_ankle_roll_link',
                'waist_yaw_link', 'waist_pitch_link', 'torso_link',
                'left_shoulder_pitch_link', 'left_shoulder_roll_link', 'left_shoulder_yaw_link', 'left_elbow_link', 'left_wrist_yaw_link', 'left_wrist_pitch_link', 'left_wrist_roll_link',
                'right_shoulder_pitch_link', 'right_shoulder_roll_link', 'right_shoulder_yaw_link', 'right_elbow_link', 'right_wrist_yaw_link', 'right_wrist_pitch_link', 'right_wrist_roll_link']

    right_foot_name: 'right_ankle_pitch_link'
    left_foot_name: 'left_ankle_pitch_link'

    nums_extend_bodies: 5
    extend_config:
      - joint_name: "left_hand_link"
        parent_name: "left_wrist_roll_link"
        pos: [0.0, 0.0, -0.06]
        rot: [1.0, 0.0, 0.0, 0.0] # w x y z
      - joint_name: "right_hand_link"
        parent_name: "right_wrist_roll_link"
        pos: [0.0, 0.0, -0.06]
        rot: [1.0, 0.0, 0.0, 0.0] # w x y z
      - joint_name: "head_link"
        parent_name: "pelvis"
        pos: [0.0, 0.0, 0.4]
        rot: [1.0, 0.0, 0.0, 0.0] # w x y z
      - joint_name: "left_toe_link"
        parent_name: "left_ankle_roll_link"
        pos: [0.08, 0.0, 0.0]
        rot: [1.0, 0.0, 0.0, 0.0]
      - joint_name: "right_toe_link"
        parent_name: "right_ankle_roll_link"
        pos: [0.08, 0.0, 0.0]
        rot: [1.0, 0.0, 0.0, 0.0]

    motion_tracking_link:
      - "left_hand_link"
      - "right_hand_link"
      - "head_link"

    lower_body_link:
      - "pelvis"
      - "left_hip_pitch_link"
      - "left_hip_roll_link"
      - "left_hip_yaw_link"
      - "left_knee_link"
      - "left_ankle_pitch_link"
      - "left_ankle_roll_link"
      - "right_hip_pitch_link"
      - "right_hip_roll_link"
      - "right_hip_yaw_link"
      - "right_knee_link"
      - "right_ankle_pitch_link"
      - "right_ankle_roll_link"
      - "waist_yaw_link"
      - "waist_pitch_link"
      - "torso_link"

    upper_body_link:
      - "left_shoulder_pitch_link"
      - "left_shoulder_roll_link"
      - "left_shoulder_yaw_link"
      - "left_elbow_link"
      - "left_wrist_yaw_link"
      - "left_wrist_pitch_link"
      - "left_wrist_roll_link"
      - "right_shoulder_pitch_link"
      - "right_shoulder_roll_link"
      - "right_shoulder_yaw_link"
      - "right_elbow_link"
      - "right_wrist_yaw_link"
      - "right_wrist_pitch_link"
      - "right_wrist_roll_link"
      - "left_hand_link"
      - "right_hand_link"
      - "head_link"

    pelvis_link: "pelvis"
    base_link: "torso_link"
    hips_link:
      - "left_hip_pitch_link"
      - "left_hip_roll_link"
      - "left_hip_yaw_link"
      - "right_hip_pitch_link"
      - "right_hip_roll_link"
      - "right_hip_yaw_link"
    
    joint_matches:
      - ["pelvis", "Pelvis"]
      - ["left_hip_pitch_link", "L_Hip"]
      - ["left_knee_link", "L_Knee"]
      - ["left_ankle_roll_link", "L_Ankle"]
      - ["right_hip_pitch_link", "R_Hip"]
      - ["right_knee_link", "R_Knee"]
      - ["right_ankle_roll_link", "R_Ankle"]
      - ["left_shoulder_roll_link", "L_Shoulder"]
      - ["left_elbow_link", "L_Elbow"]
      - ["left_hand_link", "L_Hand"]
      - ["right_shoulder_roll_link", "R_Shoulder"]
      - ["right_elbow_link", "R_Elbow"]
      - ["right_hand_link", "R_Hand"]
      - ["head_link", "Head"]
      - ["left_toe_link", "L_Toe"]
      - ["right_toe_link", "R_Toe"]

    smpl_pose_modifier:
      - Pelvis: "[np.pi/2, 0, np.pi/2]"
      - L_Shoulder: "[0, 0, -np.pi/2]"
      - R_Shoulder: "[0, 0, np.pi/2]"

    visualization:
      customize_color : True
      marker_joint_colors : 
      - [0.929, 0.867, 0.437] # pelvis
      - [0.929, 0.867, 0.437] # left_hip_yaw_joint
      - [0.929, 0.867, 0.437] # left_hip_roll_joint
      - [0.929, 0.867, 0.437] # left_hip_pitch_joint
      - [0.929, 0.867, 0.437] # left_knee_joint
      - [0.929, 0.867, 0.437] # left_ankle_pitch_joint
      - [0.929, 0.867, 0.437] # left_ankle_roll_joint
      - [0.929, 0.867, 0.437] # right_hip_yaw_joint
      - [0.929, 0.867, 0.437] # right_hip_roll_joint
      - [0.929, 0.867, 0.437] # right_hip_pitch_joint
      - [0.929, 0.867, 0.437] # right_knee_joint
      - [0.929, 0.867, 0.437] # right_ankle_pitch_joint
      - [0.929, 0.867, 0.437] # right_ankle_roll_joint
      - [0.929, 0.867, 0.437] # waist_yaw_joint
      - [0.929, 0.867, 0.437] # motor_waist_pitch_joint
      - [0.929, 0.867, 0.437] # torso_joint (motor_waist_roll_joint)
      - [0.929, 0.867, 0.437] # left_shoulder_pitch_joint
      - [0.929, 0.867, 0.437] # left_shoulder_roll_joint
      - [0.929, 0.867, 0.437] # left_shoulder_yaw_joint
      - [0.929, 0.867, 0.437] # left_elbow_joint
      - [0.929, 0.867, 0.437] # left_wrist_yaw_joint
      - [0.929, 0.867, 0.437] # left_wrist_pitch_joint
      - [0.929, 0.867, 0.437] # left_wrist_roll_joint
      - [0.929, 0.867, 0.437] # right_shoulder_pitch_joint
      - [0.929, 0.867, 0.437] # right_shoulder_roll_joint
      - [0.929, 0.867, 0.437] # right_shoulder_yaw_joint
      - [0.929, 0.867, 0.437] # right_elbow_joint
      - [0.929, 0.867, 0.437] # right_wrist_yaw_joint
